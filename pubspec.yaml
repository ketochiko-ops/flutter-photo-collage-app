name: flutter_photo_collage_app
description: Local-first photo framing and collage app for Windows, iOS, Android, iPadOS, and macOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  exif: ^3.3.0
  file_selector: ^1.0.3
  google_mobile_ads: ^5.1.0
  image: ^4.2.0
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
